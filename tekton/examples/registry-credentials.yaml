# --- Tekton side: ServiceAccount + registry credentials ---
#
# The tekton.dev/docker-0 annotation tells Tekton to mount these
# credentials as ~/.docker/config.json inside Task Step containers.
# ORAS reads ~/.docker/config.json automatically.
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  annotations:
    tekton.dev/docker-0: registry.example.com
type: kubernetes.io/dockerconfigjson
data:
  # Replace with base64-encoded docker config JSON:
  #   echo '{"auths":{"registry.example.com":{"auth":"<base64 user:pass>"}}}' | base64
  .dockerconfigjson: REPLACE_WITH_BASE64_ENCODED_DOCKER_CONFIG
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-oci-push
secrets:
  - name: registry-credentials
imagePullSecrets:
  - name: registry-credentials
---
# --- RBAC for promotion task ---
#
# The promote task needs permission to get and patch Argo CD
# Application resources. This ClusterRole + ClusterRoleBinding
# grants that access to the tekton-oci-push ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-argocd-promote
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-argocd-promote
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-argocd-promote
subjects:
  - kind: ServiceAccount
    name: tekton-oci-push
    namespace: default
---
# --- Argo CD side: OCI repository credentials ---
#
# Register the OCI registry so Argo CD can pull artifacts.
# Alternative: argocd repo add oci://registry.example.com/manifests/my-app \
#              --type oci --username <user> --password <pass>
apiVersion: v1
kind: Secret
metadata:
  name: oci-repo-my-app
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: oci
  url: oci://registry.example.com/manifests/my-app
  username: REPLACE_WITH_REGISTRY_USERNAME
  password: REPLACE_WITH_REGISTRY_PASSWORD
